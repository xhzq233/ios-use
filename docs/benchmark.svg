<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="title desc">
<title id="title">ios-use vs Appium + WDA: historical latency benchmark</title>
<desc id="desc">Real iPhone Settings, May 30 2026. Two zero-based linear scales separate short operations from startup and scrolling. Exact values and methodology are in the README table.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1f2937;font-size:15px}.small{font-size:13px;fill:#475569}.heading{font-size:18px;font-weight:600}.ios{fill:#047857}.wda{fill:#6366f1}.grid{stroke:#e2e8f0;stroke-width:1}</style>
<rect width="900" height="790" rx="12" fill="#ffffff"/>
<text x="30" y="38" font-size="24" style="font-size:24px;font-weight:600">Less waiting between actions</text>
<text x="30" y="65" class="small">Historical native CLI benchmark · 2026-05-30 · Lower latency is better</text>
<rect x="30" y="87" width="15" height="12" class="ios"/><text x="53" y="99">ios-use</text>
<rect x="170" y="87" width="15" height="12" class="wda"/><text x="193" y="99">Appium + WDA</text>
<text x="30" y="140" class="heading">Observe and act</text><text x="865" y="140" text-anchor="end" class="small">Latency (ms) · separate scale</text><line x1="210" y1="155" x2="210" y2="486" class="grid"/><text x="210" y="506" text-anchor="middle" class="small">0</text><line x1="345" y1="155" x2="345" y2="486" class="grid"/><text x="345" y="506" text-anchor="middle" class="small">375</text><line x1="480" y1="155" x2="480" y2="486" class="grid"/><text x="480" y="506" text-anchor="middle" class="small">750</text><line x1="615" y1="155" x2="615" y2="486" class="grid"/><text x="615" y="506" text-anchor="middle" class="small">1,125</text><line x1="750" y1="155" x2="750" y2="486" class="grid"/><text x="750" y="506" text-anchor="middle" class="small">1,500</text><text x="30" y="187">Cached UI tree</text><rect x="210" y="168" width="7.45" height="16" rx="2" class="ios"/><text x="225.45" y="181" class="small">20.7</text><rect x="210" y="190" width="347.65" height="16" rx="2" class="wda"/><text x="565.65" y="203" class="small">965.7</text><text x="30" y="253">Wait for element</text><rect x="210" y="234" width="5.04" height="16" rx="2" class="ios"/><text x="223.04" y="247" class="small">14.0</text><rect x="210" y="256" width="111.13" height="16" rx="2" class="wda"/><text x="329.13" y="269" class="small">308.7</text><text x="30" y="319">Screenshot</text><rect x="210" y="300" width="29.23" height="16" rx="2" class="ios"/><text x="247.23" y="313" class="small">81.2</text><rect x="210" y="322" width="64.44" height="16" rx="2" class="wda"/><text x="282.44" y="335" class="small">179.0</text><text x="30" y="385">Tap by label</text><rect x="210" y="366" width="148.75" height="16" rx="2" class="ios"/><text x="366.75" y="379" class="small">413.2</text><rect x="210" y="388" width="387.47" height="16" rx="2" class="wda"/><text x="605.47" y="401" class="small">1,076.3</text><text x="30" y="451">Terminate app</text><rect x="210" y="432" width="430.24" height="16" rx="2" class="ios"/><text x="648.24" y="445" class="small">1,195.1</text><rect x="210" y="454" width="411.84" height="16" rx="2" class="wda"/><text x="629.84" y="467" class="small">1,144.0</text><text x="30" y="552" class="heading">Start and navigate</text><text x="865" y="552" text-anchor="end" class="small">Latency (ms) · separate scale</text><line x1="210" y1="567" x2="210" y2="700" class="grid"/><text x="210" y="720" text-anchor="middle" class="small">0</text><line x1="345" y1="567" x2="345" y2="700" class="grid"/><text x="345" y="720" text-anchor="middle" class="small">5,000</text><line x1="480" y1="567" x2="480" y2="700" class="grid"/><text x="480" y="720" text-anchor="middle" class="small">10,000</text><line x1="615" y1="567" x2="615" y2="700" class="grid"/><text x="615" y="720" text-anchor="middle" class="small">15,000</text><line x1="750" y1="567" x2="750" y2="700" class="grid"/><text x="750" y="720" text-anchor="middle" class="small">20,000</text><text x="30" y="599">Start session</text><rect x="210" y="580" width="52.78" height="16" rx="2" class="ios"/><text x="270.78" y="593" class="small">1,954.8</text><rect x="210" y="602" width="290.35" height="16" rx="2" class="wda"/><text x="508.35" y="615" class="small">10,753.6</text><text x="30" y="665">Scroll to element</text><rect x="210" y="646" width="291.58" height="16" rx="2" class="ios"/><text x="509.58" y="659" class="small">10,799.2</text><rect x="210" y="668" width="460.37" height="16" rx="2" class="wda"/><text x="678.37" y="681" class="small">17,050.9</text><text x="30" y="752" class="small">3 iterations per command; 1 cold-start sample. Screenshot excludes OCR.</text><text x="30" y="775" class="small">Not a REPL or Agent benchmark. Not rerun for the current development version.</text></svg>
