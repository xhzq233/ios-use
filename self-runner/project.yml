name: IOSUseSelfRunner
options:
  deploymentTarget:
    iOS: '17.4'
  createIntermediateGroups: true
packages:
  IOSUseProtocol:
    path: ../shared/IOSUseProtocol
  SelfRunnerCore:
    path: Core
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0
  NIOSSL:
    url: https://github.com/apple/swift-nio-ssl.git
    from: 2.28.0
  Fory:
    url: https://github.com/apache/fory.git
    revision: affbd38a5869a3ec4deaf51a762bedf2c90400d5
settings:
  base:
    IOS_USE_REPOSITORY_ROOT: ${IOS_USE_REPOSITORY_ROOT}
    SWIFT_VERSION: '5.9'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
targets:
  IOSUseSelfRunner:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, "*.entitlements"]
      - path: ../swift-cli/Sources/IOSUseCLI/Services/RealDevice/Transport
      - path: ../swift-cli/Sources/IOSUseCLI/Support/POSIX.swift
      - path: ../swift-cli/Sources/IOSUseCLI/Services/RealDevice/CoreDevice
        includes:
          - CoreDeviceTunnelClient.swift
          - CoreDeviceUserSpaceTCP.swift
          - RemoteXPCClient.swift
      - path: ../swift-cli/Sources/IOSUseCLI/Services/RealDevice/TestManager
        includes:
          - DVTInstrumentsClient.swift
          - DVTInstrumentsContract.swift
          - XCTestConfigurationPayload.swift
          - XCTestManagerAuthorization.swift
          - DTXConnectionIdleListener.swift
          - XCTestExecCallbackListener.swift
    dependencies:
      - package: IOSUseProtocol
      - package: SelfRunnerCore
      - package: NIO
        product: NIOCore
      - package: NIO
        product: NIOPosix
      - package: NIOSSL
      - target: IOSUseSelfRunnerRuntime
        link: false
        embed: true
    info:
      path: ${IOS_USE_REPOSITORY_ROOT}/self-runner/App/Info.plist
      properties:
        CFBundleDisplayName: ios-use Runner
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Connect to this device's developer services for on-device automation.
        NSLocationWhenInUseUsageDescription: Keep an explicitly started automation session running while you switch apps.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keep an explicitly started automation session running while you switch apps.
        UIBackgroundModes: [location]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ios-use-runner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosuse.selfrunner
        INFOPLIST_FILE: $(IOS_USE_REPOSITORY_ROOT)/self-runner/App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: $(IOS_USE_REPOSITORY_ROOT)/self-runner/App/Bootstrap.h
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/Frameworks', /System/Developer/Library/Frameworks, /System/Developer/Library/PrivateFrameworks]
  IOSUseSelfRunnerRuntime:
    type: framework
    platform: iOS
    sources:
      - path: Runtime
        excludes: [Info.plist]
      - path: ../driver/ui
      - path: ../driver/tcp
      - path: ../shared/IOSUseProtocol/Sources/IOSUseProtocol
    dependencies:
      - package: Fory
    info:
      path: ${IOS_USE_REPOSITORY_ROOT}/self-runner/Runtime/Info.plist
    settings:
      base:
        INFOPLIST_FILE: $(IOS_USE_REPOSITORY_ROOT)/self-runner/Runtime/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.iosuse.selfrunner.runtime
        DEFINES_MODULE: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(IOS_USE_REPOSITORY_ROOT)/driver/ui/Helpers/IOSUseDriver-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) FORY_SWIFT_MACRO'
        FRAMEWORK_SEARCH_PATHS: ['$(inherited)', '$(PLATFORM_DIR)/Developer/Library/Frameworks']
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/Frameworks', /System/Developer/Library/Frameworks, /System/Developer/Library/PrivateFrameworks]
  IOSUseLoopback:
    type: app-extension
    platform: iOS
    dependencies:
      - package: SelfRunnerCore
    sources:
      - path: Tunnel
        excludes: [Info.plist, "*.entitlements"]
    info:
      path: ${IOS_USE_REPOSITORY_ROOT}/self-runner/Tunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).PacketTunnelProvider'
    entitlements:
      path: ${IOS_USE_REPOSITORY_ROOT}/self-runner/Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        INFOPLIST_FILE: $(IOS_USE_REPOSITORY_ROOT)/self-runner/Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(IOS_USE_REPOSITORY_ROOT)/self-runner/Tunnel/Tunnel.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.iosuse.selfrunner.loopback
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  IOSUseSelfRunner:
    build:
      targets:
        IOSUseSelfRunner: all
  IOSUseSelfRunnerEmbedded:
    build:
      targets:
        IOSUseSelfRunner: all
        IOSUseLoopback: all
