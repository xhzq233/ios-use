name: Driver

on:
  pull_request:
    paths:
      - "driver/**"
      - "shared/IOSUseProtocol/**"
      - "swift-cli/Sources/IOSUseCLI/CLI/Version.swift"
      - "scripts/build_driver.sh"
      - "scripts/test_driver_unit.sh"
      - ".github/workflows/driver.yml"
  push:
    branches: [main]
    paths:
      - "driver/**"
      - "shared/IOSUseProtocol/**"
      - "swift-cli/Sources/IOSUseCLI/CLI/Version.swift"
      - "scripts/build_driver.sh"
      - "scripts/test_driver_unit.sh"
      - ".github/workflows/driver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IOS_USE_TEST_SIM_BOOT_TIMEOUT_MS: 600000

permissions:
  contents: read

jobs:
  driver-unit-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Resolve Xcode cache key
        id: xcode-cache
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache driver DerivedData
        uses: actions/cache@v4
        with:
          path: driver/build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-cache.outputs.version }}-driver-${{ hashFiles('driver/project.yml', 'driver/**/*.swift', 'driver/**/*.m', 'driver/**/*.h', 'shared/IOSUseProtocol/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-cache.outputs.version }}-driver-

      - name: Build while booting, then run Driver tests
        run: bash scripts/test_driver_unit.sh
