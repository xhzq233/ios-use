name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version, for example v2.1.0-alpha.3"
        required: true
        type: string
      publish:
        description: "Publish the version; disable to build and verify the selected branch"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}-${{ github.event_name == 'push' || inputs.publish }}
  cancel-in-progress: false

env:
  IOS_USE_TEST_SIM_BOOT_TIMEOUT_MS: 600000

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve release tag and verify immutability
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          PUBLISH_FROM_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac

          if [ "$PUBLISH_FROM_BRANCH" = true ]; then
            if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              BUILD_REF="$RELEASE_TAG"
            else
              BUILD_REF="$GITHUB_SHA"
            fi
          fi

          if [ "$SHOULD_PUBLISH" = true ]; then
            if existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)" && [ -n "$existing_assets" ]; then
              echo "Release $RELEASE_TAG already has assets; publish a new version." >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$BUILD_REF" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    container: swift:6.2.4-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Cache Linux Swift build
        uses: actions/cache@v4
        with:
          path: swift-cli/.build
          key: linux-x86_64-swift-6.2.4-release-${{ hashFiles('swift-cli/Package.swift', 'swift-cli/Package.resolved', 'shared/IOSUseProtocol/Package.swift') }}
          restore-keys: |
            linux-x86_64-swift-6.2.4-release-
      - run: |
          bash scripts/build_swift_cli.sh
          mkdir -p release && cp ios-use release/ios-use-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/ios-use-linux-x86_64
          compression-level: 0

  mac-cli:
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Resolve Xcode build
        id: xcode
        run: |
          swift --version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - name: Cache Swift CLI build
        uses: actions/cache@v4
        with:
          path: swift-cli/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-cli-release-${{ steps.xcode.outputs.build }}-${{ hashFiles('swift-cli/Package.swift', 'swift-cli/Package.resolved', 'shared/IOSUseProtocol/Package.swift', 'ThirdParty/PlayCover/Package.swift', 'ThirdParty/inject/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-cli-release-
      - run: |
          bash scripts/build_swift_cli.sh --skip-runtime
          mkdir -p release && cp ios-use release/ios-use-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-cli
          path: release/ios-use-darwin-arm64
          compression-level: 0

  driver:
    needs: prepare
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: device
            asset: driver.ipa
          - platform: simulator
            asset: driver-sim.ipa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Install tools and resolve Xcode build
        id: xcode
        run: |
          brew install xcodegen ripgrep
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - name: Cache driver build products
        uses: actions/cache@v4
        with:
          path: driver/build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-driver-release-${{ matrix.platform }}-${{ hashFiles('driver/project.yml', 'shared/IOSUseProtocol/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-driver-release-${{ matrix.platform }}-
      - name: Build driver
        run: bash scripts/build_driver.sh --release --${{ matrix.platform }}-only
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}
          path: driver/build/${{ matrix.asset }}
          compression-level: 0

  mac-resources:
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - run: brew install xcodegen ripgrep meson ninja
      - name: Cache pinned PlayCover upstream audit checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-use-playcover-upstream-audit
          key: ${{ runner.os }}-${{ runner.arch }}-playcover-upstreams-7190cc9-d688f6-e6d3aa
      - name: Build Mac resource archive
        env:
          IOS_USE_PLAYCOVER_UPSTREAM_CACHE: ${{ runner.temp }}/ios-use-playcover-upstream-audit
          PYTHON: /usr/bin/python3
        run: bash scripts/build_release_mac_resources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-resources
          path: release/ios-use-mac-resources.tar.gz
          compression-level: 0

  release:
    needs: [prepare, linux, mac-cli, driver, mac-resources]
    name: Verify and publish release assets
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-*
          merge-multiple: true
          path: release
      - name: Assemble and verify Mac release assets
        env:
          IOS_USE_RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          bash scripts/release_build.sh --assemble-only
          bash scripts/test_playcover_installed_layout.sh --release-dir release --verify-only
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release
      - name: Include Linux assets in release checksums
        run: cd release && shasum -a 256 ios-use-linux-x86_64 >> SHA256SUMS
      - name: Retain verified assets for build-only runs
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          compression-level: 0
      - name: Upload to Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          files: |
            release/ios-use-darwin-arm64
            release/ios-use-linux-x86_64
            release/driver.ipa
            release/driver-sim.ipa
            release/ios-use-mac-resources.tar.gz
            release/SHA256SUMS
          body_path: release-notes/CHANGELOG-${{ needs.prepare.outputs.tag }}.md
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          make_latest: ${{ !contains(needs.prepare.outputs.tag, '-') }}
          overwrite_files: false
          fail_on_unmatched_files: true
