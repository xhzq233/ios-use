name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version, for example v2.1.0-alpha.3"
        required: true
        type: string
      publish:
        description: "Publish the version; disable to build and verify the selected branch"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}-${{ github.event_name == 'push' || inputs.publish }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IOS_USE_TEST_SIM_BOOT_TIMEOUT_MS: 600000

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve source and release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_FROM_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          if [ "$PUBLISH_FROM_BRANCH" = true ]; then
            set +e
            git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" > /dev/null
            tag_status=$?
            set -e
            case "$tag_status" in
              0) BUILD_REF="$RELEASE_TAG" ;;
              2) BUILD_REF="$GITHUB_SHA" ;;
              *) echo "Unable to resolve release tag" >&2; exit "$tag_status" ;;
            esac
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$BUILD_REF" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing asset set
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set +e
          release_probe="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          probe_status=$?
          set -e
          http_status="$(printf '%s\n' "$release_probe" | awk 'NR == 1 { print $2 }')"
          if [ "$http_status" = "404" ]; then
            exit 0
          fi
          if [ "$probe_status" -ne 0 ] || [ "$http_status" != "200" ]; then
            echo "Unable to inspect release $RELEASE_TAG (HTTP ${http_status:-unknown})." >&2
            exit 1
          fi
          existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if [ -n "$existing_assets" ]; then
            echo "Release $RELEASE_TAG already has assets; publish a new version." >&2
            exit 1
          fi

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    container: swift:6.2.4-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - run: bash scripts/build_swift_cli.sh
      - run: mkdir -p release && cp ios-use release/ios-use-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/ios-use-linux-x86_64
          compression-level: 0

  mac-cli:
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Cache Swift CLI build
        uses: actions/cache@v4
        with:
          path: swift-cli/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-cli-release-${{ hashFiles('swift-cli/Package.swift', 'swift-cli/Package.resolved', 'swift-cli/Sources/**/*.swift', 'shared/IOSUseProtocol/**/*.swift', 'ThirdParty/PlayCover/**/*.swift', 'ThirdParty/inject/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-cli-release-
      - run: bash scripts/build_swift_cli.sh --skip-runtime
      - run: mkdir -p release && cp ios-use release/ios-use-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-cli
          path: release/ios-use-darwin-arm64
          compression-level: 0

  driver:
    needs: prepare
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: device
            asset: driver.ipa
          - platform: simulator
            asset: driver-sim.ipa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - run: brew install xcodegen
      - name: Resolve Xcode cache key
        id: xcode-cache
        run: |
          xcodebuild -version
          swift --version
          echo "version=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache driver build products
        uses: actions/cache@v4
        with:
          path: driver/build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-cache.outputs.version }}-driver-release-${{ matrix.platform }}-${{ hashFiles('driver/project.yml', 'driver/**/*.swift', 'driver/**/*.m', 'driver/**/*.h', 'shared/IOSUseProtocol/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-cache.outputs.version }}-driver-release-${{ matrix.platform }}-
      - name: Build driver
        run: bash scripts/build_driver.sh --release --${{ matrix.platform }}-only
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}
          path: driver/build/${{ matrix.asset }}
          compression-level: 0
      - name: Retain compiler timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}-logs
          path: driver/build/*-xcodebuild.log

  mac-resources:
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - run: brew install xcodegen meson ninja
      - name: Cache pinned PlayCover upstream audit checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-use-playcover-upstream-audit
          key: ${{ runner.os }}-${{ runner.arch }}-playcover-upstreams-7190cc9-d688f6-e6d3aa
      - name: Build Mac resource archive
        env:
          IOS_USE_PLAYCOVER_UPSTREAM_CACHE: ${{ runner.temp }}/ios-use-playcover-upstream-audit
          PYTHON: /usr/bin/python3
        run: bash scripts/build_release_mac_resources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-resources
          path: release/ios-use-mac-resources.tar.gz
          compression-level: 0

  release:
    needs: [prepare, linux, mac-cli, driver, mac-resources]
    name: Verify and publish release assets
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: driver-device
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: driver-simulator
          path: release
      - name: Assemble Mac assets
        env:
          IOS_USE_RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: bash scripts/release_build.sh --assemble-only
      - name: Verify the exact release assets through an isolated install
        run: bash scripts/test_playcover_installed_layout.sh --release-dir release --verify-only
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release
      - name: Include Linux assets in release checksums
        run: cd release && shasum -a 256 ios-use-linux-x86_64 >> SHA256SUMS
      - name: Retain verified assets for build-only runs
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          compression-level: 0
      - name: Upload to Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          files: |
            release/ios-use-darwin-arm64
            release/ios-use-linux-x86_64
            release/driver.ipa
            release/driver-sim.ipa
            release/ios-use-mac-resources.tar.gz
            release/SHA256SUMS
          body_path: release-notes/CHANGELOG-${{ needs.prepare.outputs.tag }}.md
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          make_latest: ${{ !contains(needs.prepare.outputs.tag, '-') }}
          overwrite_files: false
          fail_on_unmatched_files: true
