name: Script Contracts

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  script-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts and packaging contracts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile scripts/frida_distribution.py
          bash scripts/test_install.sh
          bash scripts/test_playcover_packaging_contract.sh
          bash scripts/test_playcover_live_workflow_contract.sh
          node --check scripts/benchmark.js
          node --check scripts/ios_use_test_simulator.js
          node --check scripts/test_simulator_commands.mjs
